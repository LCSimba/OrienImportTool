[project]
name = "orien_import_tool"
version = "0.1.0"
description = "Reliability platform: import Orien Tactics FMEA, normalise to ISO 14224, classify downtime"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.92.0",
    "pydantic>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "anthropic>=0.92.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
